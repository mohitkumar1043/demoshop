<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shopkeeper Dashboard</title>

    <link
        rel="stylesheet"
        href="shopkeeper.css"
    >

</head>

<body>



    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div>

            <h1>
                🏪 Shopkeeper Dashboard
            </h1>

            <p>
                Manage your products
            </p>

        </div>

        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </header>


    <main class="container">


        <!-- =================================================
             ADD / EDIT PRODUCT
        ================================================== -->

        <section class="card">

            <h2 id="formTitle">
                Add Product
            </h2>


            <form id="productForm">


                <label>
                    Product ID
                </label>

                <input
                    type="text"
                    id="productId"
                    readonly
                    placeholder="Automatic"
                >


                <label>
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                    required
                >


                <label>
                    Description
                </label>

                <textarea
                    id="productDescription"
                    placeholder="Enter product description"
                ></textarea>


                <label>
                    Price
                </label>

                <input
                    type="number"
                    id="productPrice"
                    min="0"
                    step="0.01"
                    placeholder="Enter price"
                    required
                >


                <label>
                    Discount (%)
                </label>

                <input
                    type="number"
                    id="productDiscount"
                    min="0"
                    max="100"
                    value="0"
                >


                <label>
                    Product Image URL
                </label>

                <input
                    type="url"
                    id="productImage"
                    placeholder="https://example.com/image.jpg"
                >


                <div
                    id="imagePreview"
                    class="image-preview"
                ></div>


                <label class="available">

                    <input
                        type="checkbox"
                        id="productAvailable"
                        checked
                    >

                    Product Available

                </label>


                <button
                    type="submit"
                    class="save-button"
                >
                    Save Product
                </button>


                <button
                    type="button"
                    id="cancelEdit"
                    class="cancel-button"
                    style="display:none;"
                >
                    Cancel Edit
                </button>

            </form>

        </section>


        <!-- =================================================
             PRODUCT LIST
        ================================================== -->

        <section class="card">

            <div class="list-header">

                <div>

                    <h2>
                        Products
                    </h2>

                    <p>
                        Total:
                        <strong id="productCount">
                            0
                        </strong>
                    </p>

                </div>


                <button
                    id="refreshButton"
                    class="refresh-button"
                >
                    Refresh
                </button>

            </div>


            <div
                id="adminProductList"
            >
                Loading products...
            </div>

        </section>

    </main>

<div id="customAlert" role="alert" aria-live="polite">
    <span id="customAlertMessage"></span>
</div>

<script src="shopkeeper.js"></script>
</body>

</html>
