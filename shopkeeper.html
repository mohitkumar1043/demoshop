<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shopkeeper Login</title>

    <link
        rel="stylesheet"
        href="shopkeeper.css">

</head>

<body>

    <div class="page">

        <!-- LEFT / BRAND AREA -->
        <div class="brand-section">

            <div class="brand-content">

                <div class="shop-icon">
                    🏪
                </div>

                <h1>
                    My Local Shop
                </h1>

                <p>
                    Shopkeeper Management Portal
                </p>

                <div class="features">

                    <div class="feature">
                        <span>✓</span>
                        Manage Products
                    </div>

                    <div class="feature">
                        <span>✓</span>
                        Update Prices
                    </div>

                    <div class="feature">
                        <span>✓</span>
                        Manage Stock
                    </div>

                    <div class="feature">
                        <span>✓</span>
                        Secure Access
                    </div>

                </div>

            </div>

        </div>


        <!-- LOGIN AREA -->
        <div class="login-section">

            <div class="login-card">

                <div class="mobile-logo">

                    <div class="mobile-shop-icon">
                        🏪
                    </div>

                    <h2>
                        My Local Shop
                    </h2>

                </div>


                <div class="login-heading">

                    <h2>
                        Welcome Back 👋
                    </h2>

                    <p>
                        Login to manage your shop
                    </p>

                </div>


                <!-- ERROR -->
                <div
                    id="loginError"
                    class="login-error">

                </div>


                <form id="loginForm">


                    <!-- USERNAME -->

                    <div class="input-group">

                        <label for="username">
                            Shopkeeper ID
                        </label>

                        <div class="input-box">

                            <span class="input-icon">
                                👤
                            </span>

                            <input
                                type="text"
                                id="username"
                                placeholder="Enter your shopkeeper ID"
                                autocomplete="username"
                                required>

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                id="togglePassword"
                                class="eye-button"
                                aria-label="Show password">

                                👁

                            </button>

                        </div>

                    </div>


                    <!-- OPTIONS -->

                    <div class="login-options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="rememberMe">

                            <span>
                                Remember me
                            </span>

                        </label>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="login-button">

                        <span id="loginText">
                            Login
                        </span>

                        <span
                            id="loginLoader"
                            class="loader">

                        </span>

                    </button>


                </form>


                <!-- SECURITY -->

                <div class="security-info">

                    <span>
                        🔐
                    </span>

                    <div>

                        <strong>
                            Secure Login
                        </strong>

                        <p>
                            Your shop data is protected.
                        </p>

                    </div>

                </div>


                <div class="login-footer">

                    Shopkeeper Portal

                    <span>•</span>

                    Secure Access

                </div>

            </div>

        </div>

    </div>


    <script>

        /* =========================
           PASSWORD SHOW / HIDE
        ========================= */

        const password =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");


        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    password.type === "password"
                ) {

                    password.type = "text";

                    togglePassword.innerText = "🙈";

                } else {

                    password.type = "password";

                    togglePassword.innerText = "👁";

                }

            }
        );


        /* =========================
           LOGIN
        ========================= */

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const loginText =
            document.getElementById("loginText");

        const loginLoader =
            document.getElementById("loginLoader");

        const loginError =
            document.getElementById("loginError");


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const passwordValue =
                    password.value;


                if (!username) {

                    showError(
                        "Please enter your Shopkeeper ID."
                    );

                    return;

                }


                if (!passwordValue) {

                    showError(
                        "Please enter your password."
                    );

                    return;

                }


                /* LOGIN LOADING */

                loginButton.disabled = true;

                loginText.innerText =
                    "Signing in...";

                loginLoader.style.display =
                    "inline-block";

                loginError.style.display =
                    "none";


                /*
                 * YOUR CLOUDFLARE WORKER
                 *
                 * Replace this URL later.
                 */

                const WORKER_URL =
                    "https://YOUR-WORKER.workers.dev";


                try {

                    const response =
                        await fetch(
                            WORKER_URL + "/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        username:
                                            username,

                                        password:
                                            passwordValue

                                    })

                            }
                        );


                    const result =
                        await response.json();


                    if (!response.ok ||
                        !result.success) {

                        throw new Error(
                            result.message ||
                            "Invalid login details."
                        );

                    }


                    /*
                     * SAVE SESSION TOKEN
                     */

                    if (result.token) {

                        localStorage.setItem(
                            "shopkeeperToken",
                            result.token
                        );

                    }


                    /*
                     * LOGIN SUCCESS
                     */

                    loginText.innerText =
                        "Login successful ✓";


                    setTimeout(
                        function () {

                            window.location.href =
                                "shopkeeper-dashboard.html";

                        },
                        500
                    );


                }

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    showError(
                        error.message ||
                        "Unable to login. Please try again."
                    );


                    loginButton.disabled =
                        false;


                    loginText.innerText =
                        "Login";


                    loginLoader.style.display =
                        "none";

                }

            }
        );


        /* =========================
           ERROR
        ========================= */

        function showError(message) {

            loginError.innerText =
                "⚠ " + message;

            loginError.style.display =
                "block";

        }

    </script>

</body>

</html>
