<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shopkeeper Login</title>

    <link
        rel="stylesheet"
        href="shopkeeper.css">

</head>

<body>

<div class="page">

    <!-- =========================
         BRAND AREA
    ========================== -->

    <div class="brand-section">

        <div class="brand-content">

            <div class="shop-icon">
                🏪
            </div>

            <h1>
                My Local Shop
            </h1>

            <p>
                Shopkeeper Management Portal
            </p>

            <div class="features">

                <div class="feature">
                    <span>✓</span>
                    Manage Products
                </div>

                <div class="feature">
                    <span>✓</span>
                    Update Prices
                </div>

                <div class="feature">
                    <span>✓</span>
                    Manage Stock
                </div>

                <div class="feature">
                    <span>✓</span>
                    Secure Access
                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         LOGIN AREA
    ========================== -->

    <div class="login-section">

        <div class="login-card">

            <!-- MOBILE LOGO -->

            <div class="mobile-logo">

                <div class="mobile-shop-icon">
                    🏪
                </div>

                <h2>
                    My Local Shop
                </h2>

            </div>


            <!-- HEADING -->

            <div class="login-heading">

                <h2>
                    Welcome Back 👋
                </h2>

                <p>
                    Login to manage your shop
                </p>

            </div>


            <!-- ERROR -->

            <div
                id="loginError"
                class="login-error">
            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <!-- SHOPKEEPER ID -->

                <div class="input-group">

                    <label for="username">
                        Shopkeeper ID
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your Shopkeeper ID"
                            autocomplete="username"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="eye-button"
                            aria-label="Show password">

                            👁

                        </button>

                    </div>

                </div>


                <!-- REMEMBER ME -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe">

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button">

                    <span id="loginText">
                        Login
                    </span>

                    <span
                        id="loginLoader"
                        class="loader">
                    </span>

                </button>

            </form>


            <!-- SECURITY -->

            <div class="security-info">

                <span>
                    🔐
                </span>

                <div>

                    <strong>
                        Secure Login
                    </strong>

                    <p>
                        Your shop data is protected.
                    </p>

                </div>

            </div>


            <!-- FOOTER -->

            <div class="login-footer">

                Shopkeeper Portal

                <span>•</span>

                Secure Access

            </div>

        </div>

    </div>

</div>


<!-- =========================
     LOGIN JAVASCRIPT
========================== -->

<script>

/* =========================================================
   CLOUDFLARE WORKER URL
========================================================= */

/*
   IMPORTANT:

   Replace this AFTER creating your Cloudflare Worker.

   Example:

   const WORKER_URL =
       "https://my-shop-worker.example.workers.dev";
*/

const WORKER_URL =
    "https://YOUR-WORKER.workers.dev";


/* =========================================================
   ELEMENTS
========================================================= */

const passwordInput =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginText =
    document.getElementById("loginText");

const loginLoader =
    document.getElementById("loginLoader");

const loginError =
    document.getElementById("loginError");


/* =========================================================
   SHOW / HIDE PASSWORD
========================================================= */

togglePassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            togglePassword.innerText =
                "🙈";

            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            passwordInput.type =
                "password";

            togglePassword.innerText =
                "👁";

            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(message) {

    loginError.innerText =
        "⚠ " + message;

    loginError.style.display =
        "block";

}


/* =========================================================
   HIDE ERROR
========================================================= */

function hideError() {

    loginError.innerText =
        "";

    loginError.style.display =
        "none";

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        hideError();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            passwordInput.value;


        /* =========================
           VALIDATION
        ========================== */

        if (!username) {

            showError(
                "Please enter your Shopkeeper ID."
            );

            return;

        }


        if (!password) {

            showError(
                "Please enter your password."
            );

            return;

        }


        /* =========================
           LOADING
        ========================== */

        loginButton.disabled =
            true;

        loginText.innerText =
            "Signing in...";

        loginLoader.style.display =
            "inline-block";


        try {

            /* =========================
               CLOUDFLARE LOGIN
            ========================== */

            const response =
                await fetch(
                    WORKER_URL + "/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                password:
                                    password

                            })

                    }
                );


            /* =========================
               READ RESPONSE
            ========================== */

            const result =
                await response.json();


            console.log(
                "Cloudflare login response:",
                result
            );


            /* =========================
               LOGIN FAILED
            ========================== */

            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "Invalid Shopkeeper ID or password."
                );

            }


            /* =========================
               TOKEN REQUIRED
            ========================== */

            if (!result.token) {

                throw new Error(
                    "Security token was not received."
                );

            }


            /* =========================
               REMEMBER ME
            ========================== */

            const rememberMe =
                document
                    .getElementById(
                        "rememberMe"
                    )
                    .checked;


            if (rememberMe) {

                localStorage.setItem(
                    "shopkeeperToken",
                    result.token
                );

            } else {

                sessionStorage.setItem(
                    "shopkeeperToken",
                    result.token
                );

            }


            /* =========================
               SAVE SHOPKEEPER ID
            ========================== */

            sessionStorage.setItem(
                "shopkeeperId",
                username
            );


            /* =========================
               SUCCESS
            ========================== */

            loginText.innerText =
                "Login successful ✓";

            loginLoader.style.display =
                "none";


            /* =========================
               OPEN DASHBOARD
            ========================== */

            setTimeout(
                function () {

                    window.location.href =
                        "shopkeeper-dashboard.html";

                },
                500
            );


        } catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            showError(
                error.message ||
                "Unable to login. Please try again."
            );


            loginButton.disabled =
                false;

            loginText.innerText =
                "Login";

            loginLoader.style.display =
                "none";

        }

    }
);

</script>

</body>

</html>
