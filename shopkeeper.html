<section class="form-card">

    <h2 id="formTitle">
        ➕ Add Product
    </h2>

    <form id="productForm">

        <!-- PRODUCT ID -->
        <label>
            Product ID
        </label>

        <input
            id="productId"
            type="text"
            readonly
            placeholder="Auto generated"
        >

        <label>
            Product Name
        </label>

        <input
            id="productName"
            type="text"
            required
            placeholder="Tata Salt">

        <label>
            Description
        </label>

        <textarea
            id="productDescription"
            placeholder="1 kg packet"></textarea>

        <label>
            Price
        </label>

        <input
            id="productPrice"
            type="number"
            min="0"
            step="0.01"
            required
            placeholder="30">

        <label>
            Discount %
        </label>

        <input
            id="productDiscount"
            type="number"
            min="0"
            max="100"
            value="0"
            placeholder="5">

        <label>
            Google Drive Image URL
        </label>

        <input
            id="productImage"
            type="url"
            placeholder="https://...">

        <div
            id="imagePreview"
            class="image-preview">
        </div>

        <label class="available-row">

            <input
                id="productAvailable"
                type="checkbox"
                checked>

            Product Available

        </label>

        <button
            type="submit"
            class="save-button"
            id="saveButton">

            💾 Add Product

        </button>

        <button
            type="button"
            id="cancelEdit"
            class="cancel-button"
            style="display:none;">

            Cancel Edit

        </button>

    </form>

</section>
