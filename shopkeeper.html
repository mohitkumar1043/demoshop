<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shopkeeper Portal</title>

    <link
        rel="stylesheet"
        href="shopkeeper.css">

</head>

<body>


<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div id="loginPage" class="page">

    <div class="login-card">

        <div class="logo">
            🏪
        </div>

        <h1>My Local Shop</h1>

        <p class="subtitle">
            Shopkeeper Product Manager
        </p>


        <div
            id="loginError"
            class="error-message">
        </div>


        <form id="loginForm">

            <label>
                Shopkeeper ID
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter Shopkeeper ID"
                autocomplete="username"
                required>


            <label>
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    required>

                <button
                    type="button"
                    id="togglePassword">
                    👁
                </button>

            </div>


            <button
                type="submit"
                id="loginButton"
                class="primary-button">

                Login

            </button>

        </form>


        <div class="secure-box">

            🔐 Secure Cloudflare Login

            <small>
                Your shop data is protected.
            </small>

        </div>

    </div>

</div>



<!-- =====================================================
     SHOPKEEPER PRODUCT AREA
===================================================== -->

<div
    id="adminPage"
    class="admin-page"
    style="display:none;">


    <!-- HEADER -->

    <header class="admin-header">

        <div>

            <h1>
                🏪 My Local Shop
            </h1>

            <p>
                Shopkeeper Product Manager
            </p>

        </div>


        <button
            id="logoutButton"
            class="logout-button">

            Logout

        </button>

    </header>



    <main class="admin-container">


        <!-- =================================================
             ADD / EDIT PRODUCT
        ================================================== -->

        <section class="form-card">

            <h2 id="formTitle">
                Add Product
            </h2>


            <form id="productForm">


                <!-- PRODUCT ID -->

                <label>
                    Product ID
                </label>

                <input
                    type="text"
                    id="productId"
                    readonly
                    placeholder="Automatically generated">

                <small class="readonly-text">
                    Product ID is automatically generated
                    and cannot be changed.
                </small>



                <!-- PRODUCT NAME -->

                <label>
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Tata Salt"
                    required>



                <!-- DESCRIPTION -->

                <label>
                    Description
                </label>

                <textarea
                    id="productDescription"
                    placeholder="1 kg packet">
                </textarea>



                <!-- PRICE -->

                <label>
                    Price
                </label>

                <input
                    type="number"
                    id="productPrice"
                    min="0"
                    step="0.01"
                    placeholder="30"
                    required>



                <!-- DISCOUNT -->

                <label>
                    Discount %
                </label>

                <input
                    type="number"
                    id="productDiscount"
                    min="0"
                    max="100"
                    value="0"
                    placeholder="5">



                <!-- IMAGE -->

                <label>
                    Google Drive Image URL
                </label>

                <input
                    type="url"
                    id="productImage"
                    placeholder="https://...">

                <div
                    id="imagePreview"
                    class="image-preview">
                </div>



                <!-- AVAILABLE -->

                <label class="available-row">

                    <input
                        type="checkbox"
                        id="productAvailable"
                        checked>

                    Product Available

                </label>



                <!-- SAVE -->

                <button
                    type="submit"
                    class="save-button">

                    💾 Save Product

                </button>



                <!-- CANCEL -->

                <button
                    type="button"
                    id="cancelEdit"
                    class="cancel-button"
                    style="display:none;">

                    Cancel Edit

                </button>

            </form>

        </section>



        <!-- =================================================
             PRODUCTS
        ================================================== -->

        <section class="products-card">


            <div class="products-title">

                <div>

                    <h2>
                        Products
                    </h2>

                    <p>
                        Total Products:
                        <strong id="productCount">
                            0
                        </strong>
                    </p>

                </div>


                <button
                    id="refreshButton"
                    class="refresh-button">

                    🔄 Refresh

                </button>

            </div>



            <div id="adminProductList">

                Loading products...

            </div>


        </section>


    </main>


</div>



<!-- ALERT -->

<div
    id="adminAlert"
    class="admin-alert">
</div>



<script src="shopkeeper.js"></script>

</body>

</html>
